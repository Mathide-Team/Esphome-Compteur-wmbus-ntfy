name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPHOME_VERSION: "2026.9.1"   # même version que la configuration principale

jobs:
  quality:
    name: Qualité (lint, validation ESPHome)
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Installation de Python
        run: uv python install

      - name: Lint YAML (yamllint --strict)
        run: uvx yamllint==1.38.0 --strict -c .yamllint.yaml .

      - name: Script de vérification des protections (syntaxe)
        run: uv run --no-project python -m py_compile scripts/check_branch_protection.py scripts/ci_assembler.py

      - name: Tests et couverture (journalisation SOCLE §8, scripts ; seuil lu dans pyproject.toml)
        # Seuil (95 %) et branches déclarés une seule fois dans pyproject.toml
        # ([tool.coverage.*], issue #13) : la commande ne recopie aucune valeur.
        run: uv run --group test --group scripts pytest --cov --cov-report=term-missing

      - name: Configuration principale (Esphome-Compteur-wmbus)
        uses: actions/checkout@v7
        with:
          repository: Mathilde-Team/Esphome-Compteur-wmbus
          # Branche de la configuration principale : variable de dépôt COMPTEUR_REF (défaut : main)
          ref: ${{ vars.COMPTEUR_REF || 'main' }}
          path: compteur

      - name: Assemblage config principale + paquet ntfy
        run: uv run --group scripts python scripts/ci_assembler.py compteur ci

      - name: Validation ESPHome (esphome config)
        # Valide le paquet ntfy dans la configuration réelle du compteur, sans compiler.
        run: uvx --from "esphome==${ESPHOME_VERSION}" esphome config ci/compteur-eau-lora.yaml > /dev/null

      - name: Validation ESPHome avec 0 et 10 voisins
        run: |
          for n in 0 10; do
            (cd compteur && uv run --no-project python scripts/ci_voisins.py "$n")
            uv run --group scripts python scripts/ci_assembler.py compteur "ci-$n" "ci-voisins-$n.yaml"
            uvx --from "esphome==${ESPHOME_VERSION}" esphome config "ci-$n/compteur-eau-lora.yaml" > /dev/null
          done

  compilation:
    name: Compilation (esphome compile)
    # Longue (ESP-IDF) : seulement à la demande et sur main, pas obligatoire.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: quality
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}
    timeout-minutes: 60

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Installation de Python
        run: uv python install

      - name: Configuration principale (Esphome-Compteur-wmbus, branche main)
        uses: actions/checkout@v7
        with:
          repository: Mathilde-Team/Esphome-Compteur-wmbus
          ref: ${{ vars.COMPTEUR_REF || 'main' }}
          path: compteur

      - name: Assemblage config principale + paquet ntfy
        run: uv run --group scripts python scripts/ci_assembler.py compteur ci

      - name: Compilation du firmware
        run: uvx --from "esphome==${ESPHOME_VERSION}" esphome compile ci/compteur-eau-lora.yaml
