# À AJOUTER au secrets.yaml du compteur (https://github.com/Mathide-Team/Esphome-Compteur-wmbus).
# Un sujet par personne. Sur ntfy.sh, le sujet SERT DE MOT DE PASSE : n'importe qui le connaissant
# peut lire les messages. Génère-les au hasard, par exemple :  echo "eau-$(openssl rand -hex 12)"
# Absent ou "" = rien n'est envoyé pour ce compteur. Le N de ntfy_topic_vN est celui de compteurN.
ntfy_topic_moi: "eau-3f9c2a7d1b6e4f0a8c5d2e71"   # toi : alertes + bilan quotidien
ntfy_topic_v1: "eau-a81d6c0f4e2b9a7c3d5f1e08"    # voisin 1 (compteur1) : bilan et alertes de SON compteur
ntfy_topic_v2: ""                                # voisin 2 : pas de notification
ntfy_topic_v3: ""
ntfy_topic_v4: ""
# … ntfy_topic_v5 à ntfy_topic_v10 pour les voisins suivants
# Facultatif, serveur privé ou sujets réservés (voir README, « Sécurité ») : jeton du compte
# de l'ESP, limité à l'ÉCRITURE (compteur-esp:eau-*:wo). Laisse "" sur ntfy.sh sans compte.
ntfy_token: ""
